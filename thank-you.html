<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | Suncoast Tech Support</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17992501324"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'AW-17992501324');
  </script>

  <!-- Review submissions are feedback, not Google Ads business-lead conversions. -->
  <script>
    (function () {
      var reviewKey = 'suncoast_review_pending';
      var submittedAt = 0;
      try {
        submittedAt = Number(sessionStorage.getItem(reviewKey));
        sessionStorage.removeItem(reviewKey);
      } catch (error) { return; }
      if (submittedAt > 0 && Date.now() - submittedAt >= 0 && Date.now() - submittedAt <= 10 * 60 * 1000) {
        window.suncoastReviewThankYou = true;
        try { sessionStorage.removeItem('suncoast_b2b_lead_pending'); } catch (error) {}
      }
    })();
  </script>
  <!-- Count a lead only once after a recent business inquiry submission in this browser tab. -->
  <script>
    (function () {
      if (window.suncoastReviewThankYou) return;
      var key = 'suncoast_b2b_lead_pending';
      var submittedAt = 0;
      try {
        submittedAt = Number(sessionStorage.getItem(key));
        sessionStorage.removeItem(key);
      } catch (error) {
        return;
      }

      var ageMs = Date.now() - submittedAt;
      if (submittedAt > 0 && ageMs >= 0 && ageMs <= 10 * 60 * 1000) {
        gtag('event', 'conversion', {
          'send_to': 'AW-17992501324/keBHCpWnk5McEMyQv4ND'
        });
      }
    })();
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7fafc;
      color: #163047;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .box {
      max-width: 560px;
      width: 100%;
      background: #ffffff;
      border: 1px solid #d9e3ea;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(16,54,84,.08);
      padding: 40px 32px;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 36px;
      line-height: 1.1;
    }

    p {
      margin: 0 0 14px;
      font-size: 18px;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 14px 18px;
      border-radius: 12px;
      font-weight: 700;
      background: #ff8a3d;
      color: #1f2e3a;
      text-decoration: none;
    }
  
    .thank-you-links{width:100%;max-width:600px;display:grid;gap:10px;text-align:center;padding:16px 10px;margin:0 auto}
    .thank-you-links nav{display:flex;gap:12px 18px;justify-content:center;flex-wrap:wrap}
    .thank-you-links a{font-size:13px;color:#0f5f8f;min-height:26px}
    @media(max-width:700px){body{flex-direction:column}.thank-you-links{max-width:100%}}
  </style>
</head>
<body>
  <div class="box">
    <h1 id="thankYouHeading">Thank You!</h1>
    <p id="thankYouMessage">Your request has been received.</p>
    <p id="thankYouResponse">We’ll get back to you during business hours within 15–30 minutes.</p>
    <p>Thank you for contacting Suncoast Tech Support.</p>
    <a class="btn" href="/">Return to Home</a>
  </div>
  <script>
    if (window.suncoastReviewThankYou) {
      document.getElementById('thankYouHeading').textContent = 'Thank You for Your Feedback!';
      document.getElementById('thankYouMessage').textContent = 'Your website review has been submitted to Suncoast Tech Support for private review.';
      document.getElementById('thankYouResponse').textContent = 'Website reviews are not automatically published or submitted to Google.';
    }
  </script>
  <footer class="thank-you-links" aria-label="Suncoast footer links">
    <nav aria-label="Legal links">
      <a href="https://docs.google.com/document/d/1C_8kAg7DN8BRhG9cSECQ2Qh824-fmIPj7JtrDChEk_4/edit?tab=t.0" target="_blank" rel="noopener noreferrer">Terms of Service</a>
      <a href="https://docs.google.com/document/d/1C_8kAg7DN8BRhG9cSECQ2Qh824-fmIPj7JtrDChEk_4/edit?tab=t.0#heading=h.bor022r69f3v" target="_blank" rel="noopener noreferrer">Privacy Policy</a>
      <a href="https://docs.google.com/document/d/1C_8kAg7DN8BRhG9cSECQ2Qh824-fmIPj7JtrDChEk_4/edit?tab=t.0" target="_blank" rel="noopener noreferrer">Client Authorization and Consent</a>
    </nav>
    <nav aria-label="Social links">
      <a href="https://business.suncoasttechsupport.net/facebook/" target="_blank" rel="noopener noreferrer">Facebook</a>
      <a href="https://business.suncoasttechsupport.net/linkedin/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </nav>
  </footer>
</body>
</html>
