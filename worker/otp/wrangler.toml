name = "suncoast-contact-otp"
main = "index.js"
compatibility_date = "2026-10-28"
workers_dev = true

[triggers]
crons = ["0 3 * * *"]

[vars]
SITE_ORIGIN = "https://business.suncoasttechsupport.net"
LEAD_UPSTREAM_URL = "https://suncoast-lead-form.iammoeskicova0808.workers.dev/"
# Verify notify.suncoasttechsupport.com in Resend before sending.
OTP_FROM = "Suncoast Tech Support <verify@notify.suncoasttechsupport.com>"

[[d1_databases]]
binding = "DB"
database_name = "suncoast-contact-otp"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Set the following only using 'wrangler secret put' (not in GitHub):
# TURNSTILE_SECRET, RESEND_API_KEY, OTP_SECRET, LEAD_GATEWAY_SECRET
